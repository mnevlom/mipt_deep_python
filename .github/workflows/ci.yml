name: CI

on:
  push:
    branches: [ main, hw-* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 hw-1/ --max-line-length=120 --extend-ignore=E203,W503
    
    - name: Lint with pylint
      run: |
        pip install pylint
        pylint hw-1/ --disable=C0114,C0115,C0116,R0903,C1803,R1705 --fail-under=8.0
    
    - name: Test with pytest
      run: |
        pip install pytest pytest-cov
        pytest hw-1/ --cov=hw-1 --cov-report=term-missing --cov-fail-under=90
